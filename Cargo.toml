[package]
name = "fastoneday"
version = "0.4.1"
edition = "2024"

[dependencies]
base64 = "0.22"
flate2 = "1.1"
# Audited and pinned as a library-only decoder; CLI and WinSxS features stay disabled.
msdelta = { git = "https://github.com/jlevere/msdelta.git", rev = "fb5ab88843e854f3fd32d553984d8685ae643913", default-features = false }
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "2.0.20"
time = { version = "0.3", features = ["formatting"] }
url = "2.5"
