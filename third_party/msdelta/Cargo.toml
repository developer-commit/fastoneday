# Vendored copy of https://github.com/jlevere/msdelta at
# fb5ab88843e854f3fd32d553984d8685ae643913 — library only (the CLI binary,
# fixtures, fuzzing and oracle tooling are not included). Sources are
# unmodified; see ../README.md.
[package]
name = "msdelta"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jlevere/msdelta"
description = "Pure-Rust decoder for Microsoft's MSDelta (PA30/PA31/PA19) binary patch format (vendored)."
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[features]
default = []
# WinSxS base-manifest extraction from wcp.dll (unused by fastoneday).
winsxs = ["dep:memchr"]
fuzzing = []

[dependencies]
thiserror = "2"
lzms = { path = "../lzms" }
goblin = { version = "0.10", default-features = false, features = ["pe64", "pe32"] }
lzxd = "0.2"
md-5 = "0.11"
sha2 = "0.11"
digest = "0.11"
sha1 = "0.11"
memchr = { version = "2", optional = true }
zerocopy = { version = "0.8.50", features = ["derive"] }

# Only for this crate's own unit tests (`cargo test --lib` in this directory);
# never built for dependents.
[dev-dependencies]
anyhow = "1"
insta = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
